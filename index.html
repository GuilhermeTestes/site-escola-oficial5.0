<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Escolar | Antonio Kassawara Katutok</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

:root {
  --blue: #20aaff;
  --cyan: #73e0ff;
  --background: #03060c;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: white;
  background: #03060c;
}

/* VÍDEO DE FUNDO */
#loginVideo {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  pointer-events: none;
}

.login-video-shade {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: rgba(2, 6, 14, .48);
  pointer-events: none;
}

.login-container {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 430px;
  padding: 36px 30px;
  border: 1px solid #234563;
  border-radius: 22px;
  background: rgba(5, 13, 27, .94);
  box-shadow: 0 0 55px #008cff12;
  animation: cardEnter .8s ease both;
}

.logo {
  width: 72px;
  height: 72px;
  display: grid;
  place-items: center;
  margin: 0 auto 20px;
  border: 1px solid var(--blue);
  border-radius: 19px;
  color: var(--cyan);
  font-size: 28px;
  font-weight: 800;
  box-shadow: 0 0 28px #20aaff26;
}

h1 {
  text-align: center;
  font-size: 24px;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #9aadc5;
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 28px;
}

.field {
  margin-bottom: 18px;
}

label {
  display: block;
  font-size: 13px;
  color: #dce9f8;
  margin-bottom: 8px;
}

input[type="email"],
input[type="password"] {
  width: 100%;
  padding: 14px;
  color: white;
  background: #080f1c;
  border: 1px solid #263c58;
  border-radius: 10px;
  outline: none;
  font-size: 14px;
}

input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 14px #20aaff20;
}

.privacy {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 18px 0;
  color: #aabbd0;
  font-size: 12px;
  line-height: 1.6;
}

.privacy input {
  margin-top: 3px;
  accent-color: var(--blue);
}

.login-button {
  width: 100%;
  padding: 15px;
  color: white;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 1px;
  border: 0;
  border-radius: 10px;
  background: linear-gradient(100deg, #087fe5, #24baff);
  cursor: pointer;
  transition: .25s;
}

.login-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 28px #20aaff45;
}

.message {
  display: none;
  margin-top: 14px;
  padding: 12px;
  border: 1px solid #75404a;
  border-radius: 9px;
  background: #42121b40;
  color: #ffb9c1;
  font-size: 13px;
  line-height: 1.5;
}

.contact {
  text-align: center;
  border-top: 1px solid #203149;
  margin-top: 25px;
  padding-top: 20px;
}

.contact p {
  color: #aabbd0;
  font-size: 12px;
  line-height: 1.6;
  margin-bottom: 10px;
}

.whatsapp {
  color: #61e6a0;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
}

.footer {
  margin-top: 24px;
  text-align: center;
  color: #63748b;
  font-size: 11px;
}

@keyframes cardEnter {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* INTRODUÇÃO CINEMATOGRÁFICA */

#intro {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  overflow: hidden;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  isolation: isolate;
  background:
    radial-gradient(ellipse at center, #102746 0%, #050b16 42%, #010205 100%);
}

#intro::before {
  content: "";
  position: absolute;
  inset: -50%;
  z-index: -2;
  background: conic-gradient(
    from 0deg,
    transparent,
    #087fff19,
    transparent,
    #2bd7ff13,
    transparent
  );
  animation: energyRotate 12s linear infinite;
}

#intro::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  opacity: .24;
  background-image:
    linear-gradient(#36baff0c 1px, transparent 1px),
    linear-gradient(90deg, #36baff0c 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse, black, transparent 75%);
  animation: gridMove 8s linear infinite;
}

.energy-ring {
  position: absolute;
  width: min(80vw, 680px);
  aspect-ratio: 1;
  border: 1px solid #42c4ff20;
  border-radius: 50%;
  box-shadow: 0 0 70px #087fff0b, inset 0 0 70px #087fff0b;
  animation: ringPulse 4s ease-in-out infinite;
}

.energy-ring::before,
.energy-ring::after {
  content: "";
  position: absolute;
  inset: 9%;
  border: 1px solid #58d4ff19;
  border-radius: 50%;
}

.energy-ring::after {
  inset: 20%;
  border-color: #58d4ff27;
}

.light-beam {
  position: absolute;
  top: 0;
  left: -40%;
  width: 30%;
  height: 100%;
  transform: skewX(-25deg);
  background: linear-gradient(
    90deg,
    transparent,
    #1e9fff0c,
    #50d7ff27,
    transparent
  );
  animation: beamSweep 5s ease-in-out infinite;
}

.light-beam.second {
  animation-delay: 1.7s;
  opacity: .5;
}

.banner-wrap {
  position: relative;
  width: min(85vw, 700px);
  opacity: 0;
  transform: perspective(1000px) translateY(40px) scale(.78);
  filter: blur(12px);
  animation: bannerReveal 1.8s cubic-bezier(.16, 1, .3, 1) .4s forwards;
}

.banner-wrap::before {
  content: "";
  position: absolute;
  inset: -2px;
  z-index: -1;
  border-radius: 12px;
  background: linear-gradient(
    110deg, transparent, #36baff, #b4f3ff, #138bff, transparent
  );
  background-size: 250% 100%;
  filter: blur(14px);
  opacity: .65;
  animation: borderGlow 4s linear infinite;
}

.banner-wrap img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 5px;
  box-shadow: 0 0 50px #168fff20;
  animation: bannerFloat 4s ease-in-out 2.2s infinite;
}

.loading-content {
  width: min(78vw, 380px);
  margin-top: 48px;
  text-align: center;
  opacity: 0;
  animation: textReveal 1s ease 1.4s forwards;
}

.loading-title {
  font-size: clamp(15px, 2.5vw, 19px);
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #e6f6ff;
  text-shadow: 0 0 18px #24aaff40;
}

.loading-subtitle {
  min-height: 18px;
  margin-top: 12px;
  color: #7d9cb9;
  font-size: 12px;
  letter-spacing: 1.4px;
}

.loading-track {
  width: 100%;
  height: 3px;
  margin-top: 24px;
  overflow: hidden;
  border-radius: 10px;
  background: #15263b;
  box-shadow: 0 0 15px #168fff13;
}

.loading-progress {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #087fff, #4fe5ff, #c7f6ff);
  box-shadow: 0 0 16px #28baff;
}

.loading-percent {
  display: block;
  margin-top: 12px;
  color: #6888a8;
  font-size: 11px;
  letter-spacing: 2px;
}

.corner {
  position: absolute;
  width: 38px;
  height: 38px;
  border-color: #258bca70;
  border-style: solid;
  opacity: 0;
  animation: cornerReveal 1s ease 1s forwards;
}

.corner.tl {
  top: 28px;
  left: 28px;
  border-width: 1px 0 0 1px;
}

.corner.tr {
  top: 28px;
  right: 28px;
  border-width: 1px 1px 0 0;
}

.corner.bl {
  bottom: 28px;
  left: 28px;
  border-width: 0 0 1px 1px;
}

.corner.br {
  bottom: 28px;
  right: 28px;
  border-width: 0 1px 1px 0;
}

@keyframes energyRotate {
  to { transform: rotate(360deg); }
}

@keyframes gridMove {
  to { background-position: 48px 48px; }
}

@keyframes ringPulse {
  0%, 100% { transform: scale(.94); opacity: .45; }
  50% { transform: scale(1.04); opacity: .9; }
}

@keyframes beamSweep {
  0% { left: -40%; opacity: 0; }
  20% { opacity: 1; }
  70% { opacity: .8; }
  100% { left: 120%; opacity: 0; }
}

@keyframes bannerReveal {
  0% {
    opacity: 0;
    transform: perspective(1000px) translateY(40px) scale(.78);
    filter: blur(12px) brightness(2);
  }
  60% {
    opacity: 1;
    filter: blur(0) brightness(1.5);
  }
  100% {
    opacity: 1;
    transform: perspective(1000px) translateY(0) scale(1);
    filter: blur(0) brightness(1);
  }
}

@keyframes bannerFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

@keyframes borderGlow {
  to { background-position: 250% 0; }
}

@keyframes textReveal {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes cornerReveal {
  from { opacity: 0; }
  to { opacity: .9; }
}

@media (max-width: 600px) {
  .banner-wrap { width: 88vw; }
  .loading-content { margin-top: 35px; }
  .energy-ring { width: 105vw; }
  .corner.tl { top: 15px; left: 15px; }
  .corner.tr { top: 15px; right: 15px; }
  .corner.bl { bottom: 15px; left: 15px; }
  .corner.br { bottom: 15px; right: 15px; }
}

@media (prefers-reduced-motion: reduce) {
  #intro::before,
  #intro::after,
  .energy-ring,
  .light-beam,
  .banner-wrap img {
    animation: none;
  }
}
</style>
</head>

<body>

<!-- VÍDEO DE FUNDO -->
<video id="loginVideo" autoplay muted loop playsinline aria-hidden="true">
  <source
    src="https://raw.githubusercontent.com/GuilhermeTestes/antonio-kassawara-katutok2.05/main/WhatsApp%20Video%202026-10-27%20at%206.33.11%20PM.mp4"
    type="video/mp4">
</video>
<div class="login-video-shade" aria-hidden="true"></div>

<main class="login-container" id="loginContainer">
  <div class="logo">AK</div>

  <h1>Portal Escolar</h1>
  <p class="subtitle">
    Escola Antonio Kassawara Katutok<br>
    Acesse para continuar ao site oficial.
  </p>

  <form id="loginForm">
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email"
        placeholder="Digite seu e-mail"
        autocomplete="email" required>
    </div>

    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha"
        placeholder="Digite sua senha"
        autocomplete="current-password" required>
    </div>

    <label class="privacy">
      <input type="checkbox" id="privacidade">
      <span>
        Li e aceito o aviso de privacidade. Entendo que esta tela é
        demonstrativa e não devo inserir senhas pessoais.
      </span>
    </label>

    <button type="submit" class="login-button">
      ENTRAR NO PORTAL
    </button>

    <div class="message" id="mensagem" role="alert"></div>
  </form>

  <section class="contact">
    <p>Problemas ou dúvidas? Entre em contato comigo pelo WhatsApp:</p>
    <a class="whatsapp"
       href="https://wa.me/5518997408137"
       target="_blank"
       rel="noopener noreferrer">
      +55 18 99740-8137 ↗
    </a>
  </section>

  <p class="footer">Portal demonstrativo • Antonio Kassawara Katutok</p>
</main>

<!-- INTRODUÇÃO -->
<section id="intro" aria-label="Preparando sua experiência">
  <div class="energy-ring"></div>
  <div class="light-beam"></div>
  <div class="light-beam second"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="banner-wrap">
    <img
      id="banner"
      src="https://raw.githubusercontent.com/GuilhermeTestes/antonio-kassawara-katutok2.05/main/https://i.postimg.cc/mkdvRYFg/banner-guilherme-animado.gif"
      alt="Guilherme Kin Nose — Desenvolvedor Web">
  </div>

  <div class="loading-content">
    <div class="loading-title">Preparando sua experiência...</div>
    <div class="loading-subtitle" id="loadingSubtitle">
      Inicializando ambiente
    </div>

    <div class="loading-track">
      <div class="loading-progress" id="progress"></div>
    </div>

    <span class="loading-percent" id="percent">0%</span>
  </div>
</section>

<!-- MÚSICA DE FUNDO: SEM PLAYER VISÍVEL -->
<iframe
  id="backgroundMusic"
  title="Música de fundo"
  src="https://www.youtube.com/embed/0LyBPwhTO7k?autoplay=1&loop=1&playlist=0LyBPwhTO7k"
  allow="autoplay; encrypted-media"
  style="position:fixed;width:0;height:0;border:0;opacity:0;pointer-events:none"
  aria-hidden="true">
</iframe>

<script>
const form = document.getElementById("loginForm");
const email = document.getElementById("email");
const senha = document.getElementById("senha");
const privacidade = document.getElementById("privacidade");
const mensagem = document.getElementById("mensagem");

const loginContainer = document.getElementById("loginContainer");
const intro = document.getElementById("intro");
const banner = document.getElementById("banner");
const progress = document.getElementById("progress");
const percent = document.getElementById("percent");
const subtitle = document.getElementById("loadingSubtitle");

const siteUrl =
  "https://guilhermetestes.github.io/antonio-kassawara-katutok2.05/";

const loadingDuration = 8000;

let startedAt = 0;
let finished = false;
let animationFrame = null;

const loadingMessages = [
  { at: 0, text: "Inicializando ambiente" },
  { at: 1600, text: "Preparando sua experiência" },
  { at: 3300, text: "Carregando interface" },
  { at: 5000, text: "Quase tudo pronto" },
  { at: 6800, text: "Finalizando inicialização" }
];

function showMessage(text) {
  mensagem.textContent = text;
  mensagem.style.display = "block";
}

function enterSite() {
  if (finished) return;

  finished = true;

  if (animationFrame) {
    cancelAnimationFrame(animationFrame);
  }

  window.location.href = siteUrl;
}

function updateLoading(now) {
  if (finished) return;

  const elapsed = now - startedAt;
  const ratio = Math.min(elapsed / loadingDuration, 1);
  const value = Math.floor(ratio * 100);

  progress.style.width = value + "%";
  percent.textContent = value + "%";

  let currentMessage = loadingMessages[0].text;

  for (const item of loadingMessages) {
    if (elapsed >= item.at) {
      currentMessage = item.text;
    }
  }

  subtitle.textContent = currentMessage;

  if (ratio >= 1) {
    enterSite();
    return;
  }

  animationFrame = requestAnimationFrame(updateLoading);
}

function startIntro() {
  finished = false;
  loginContainer.style.display = "none";
  intro.style.display = "flex";

  progress.style.width = "0%";
  percent.textContent = "0%";

  startedAt = performance.now();
  animationFrame = requestAnimationFrame(updateLoading);
}

form.addEventListener("submit", function(event) {
  event.preventDefault();
  mensagem.style.display = "none";

  if (!email.value.trim() || !senha.value) {
    showMessage("Preencha o e-mail e a senha para continuar.");
    return;
  }

  if (!email.checkValidity()) {
    showMessage("Digite um endereço de e-mail válido.");
    email.focus();
    return;
  }

  if (!privacidade.checked) {
    showMessage("Marque o aviso de privacidade para continuar.");
    return;
  }

  // Esta tela é demonstrativa: não autentica nem salva credenciais.
  startIntro();
});

banner.addEventListener("error", function() {
  banner.alt = "Banner de Guilherme Kin Nose indisponível";
  banner.style.display = "none";
});
</script>

</body>
</html>
